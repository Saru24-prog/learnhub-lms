spring.config.import=optional:file:./local.properties
spring.application.name=learnhub
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/learnhub_db
spring.datasource.username=root
spring.datasource.password=CHANGE_ME

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

jwt.secret=CHANGE_ME_TO_A_BASE64_SECRET
jwt.expiration-ms=86400000

# File uploads (course materials)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
app.upload-dir=uploads
